# Render blueprint: one web service from the Dockerfile. Secrets are entered in the Render dashboard (sync: false).
services:
  - type: web
    name: farmlink
    runtime: docker
    plan: starter # a persistent disk needs a paid plan; on the free plan uploaded photos and documents are lost on every deploy
    healthCheckPath: /api/health
    disk:
      name: farmlink-uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # the service's own https URL
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
